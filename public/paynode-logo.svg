<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 100 100" fill="none">
  <!-- Hexagonal Connection Paths -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="#0A2540" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="1, 1" />
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="url(#glowGradient)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Outer Node Circles (Hexagon Vertices) -->
  <circle cx="50" cy="15" r="5" fill="#00E5FF" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="80" cy="32" r="5" fill="#0A2540" stroke="#00E5FF" stroke-width="2.0" />
  <circle cx="80" cy="68" r="5" fill="#00E5FF" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="50" cy="85" r="5" fill="#0A2540" stroke="#00E5FF" stroke-width="2.0" />
  <circle cx="20" cy="68" r="5" fill="#00E5FF" stroke="#0f172a" stroke-width="2.5" />
  <circle cx="20" cy="32" r="5" fill="#0A2540" stroke="#00E5FF" stroke-width="2.0" />

  <!-- Network Connections meeting at Center Card -->
  <line x1="50" y1="15" x2="50" y2="35" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="80" y1="32" x2="68" y2="42" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="80" y1="68" x2="68" y2="58" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="50" y1="85" x2="50" y2="65" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="20" y1="68" x2="32" y2="58" stroke="url(#lineGradient)" stroke-width="1.5" />
  <line x1="20" y1="32" x2="32" y2="42" stroke="url(#lineGradient)" stroke-width="1.5" />

  <!-- Center Digital Credit Card Panel -->
  <g transform="translate(32, 38)">
    <rect width="36" height="24" rx="4" fill="#0A2540" stroke="#00E5FF" stroke-width="2" />
    <!-- Chip -->
    <rect x="4" y="5" width="7" height="5" rx="1" fill="#FFD700" />
    <!-- Card Lines/Design -->
    <line x1="14" y1="7" x2="30" y2="7" stroke="#00E5FF" stroke-width="1.2" opacity="0.6" />
    <line x1="14" y1="11" x2="26" y2="11" stroke="#00E5FF" stroke-width="1.2" opacity="0.4" />
    <line x1="4" y1="17" x2="16" y2="17" stroke="#00E5FF" stroke-width="1.5" opacity="0.8" />
    <!-- Mini Node Spot -->
    <circle cx="30" cy="17" r="2.5" fill="#00E5FF" />
    <circle cx="25" cy="17" r="1.5" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- Definitions -->
  <defs>
    <linearGradient id="glowGradient" x1="20" y1="15" x2="80" y2="85">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="50" y1="15" x2="50" y2="85">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0A2540" stop-opacity="0.3" />
    </linearGradient>
  </defs>
</svg>
